[project]
name = "pgai-caller"
version = "0.1.0"
description = "Automated patient-simulator voice bot that stress-tests the Pretty Good AI phone agent"
requires-python = ">=3.11"
dependencies = [
    "pipecat-ai[silero,deepgram,anthropic,elevenlabs]>=0.0.68",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "websockets>=13.0",
    "twilio>=9.0",
    "anthropic>=0.40",
    "httpx>=0.27",
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/caller"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
